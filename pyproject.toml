[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-down"
version = "0.1.0"
description = "A desktop and command-line media downloader with automatic audio/video merging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "yt-dlp>=2025.1.15",
  "imageio-ffmpeg>=0.5.1",
  "you-get>=0.4.1743",
]

[dependency-groups]
build = [
  "pyinstaller>=6.11",
]

[project.scripts]
video-down = "video_down.cli:main"
video-down-gui = "video_down.gui:main"

[tool.setuptools.packages.find]
include = ["video_down*"]

